[project]
name = "axms-coding-orchestrator"
version = "0.1.0"
description = "AX Module Studio Spring-authorized LangGraph coding runtime"
requires-python = ">=3.12.13,<3.13"
dependencies = [
  "langfuse>=4.15.1,<5",
  "langgraph>=1.1,<1.2",
  "langgraph-checkpoint-postgres>=3.1,<3.2",
  "opentelemetry-api>=1.44,<2",
  "psycopg[binary,pool]>=3.2,<3.3",
  "pycryptodome>=3.23,<4",
  "redis>=6.4,<7",
]

[tool.uv]
package = false

[tool.unittest]
start-directory = "tests"
